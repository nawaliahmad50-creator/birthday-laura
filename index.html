<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Happy Birthday JIHAND</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0718;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;height:100vh;width:100vw;touch-action:none}#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(at 50% 30%,#2a1550,#0d0718 70%);z-index:100}.neon-btn{border:3px solid #ff8df5;padding:14px 60px;border-radius:999px;font-family:'Baloo 2';font-size:34px;color:#ffb8fb;letter-spacing:5px;background:rgba(255,100,255,.1);box-shadow:0 0 20px #ff6cf0,inset 0 0 20px #ff6cf0;animation:glow 1.5s infinite alternate}@keyframes glow{from{box-shadow:0 0 15px #ff6cf0}to{box-shadow:0 0 35px #ff8df5,0 0 60px #ff6cf0}}#count{font-family:'Baloo 2';font-size:110px;color:#ffb8fb;text-shadow:0 0 20px #ff6cf0,0 0 50px #ff6cf0;display:none;margin-top:20px}#main{position:fixed;inset:0;display:none;background:radial-gradient(ellipse at center,#1a1140 0%,#0d0718 70%);perspective:1000px}.stars::before{content:'';position:absolute;inset:-50%;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 70%,#ffb8fb,transparent);background-size:250px 250px;animation:moveStars 50s linear infinite}@keyframes moveStars{to{transform:translate(60px,60px)}}.neon-title{position:absolute;top:6%;left:50%;transform:translateX(-50%);font-family:'Baloo 2';font-size:clamp(22px,6.5vw,40px);color:#ffb8fb;text-align:center;line-height:1.1;text-shadow:0 0 10px #ff6cf0,0 0 30px #ff6cf0;width:92%}.center-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;display:flex;align-items:center;justify-content:center;transition:transform.1s}.ring1{position:absolute;width:180px;height:180px;border-radius:50%;border:2px solid rgba(200,100,255,.45);box-shadow:0 0 25px #a86cff;animation:ringRotate 7s linear infinite}.ring2{position:absolute;width:260px;height:50px;top:50%;border-radius:50%;border:6px solid rgba(168,108,255,.25);border-left-color:rgba(168,108,255,.7);border-right-color:rgba(168,108,255,.7);transform:translateY(-50%) rotateX(75deg);animation:ringRotate2 5s linear infinite}@keyframes ringRotate{to{transform:rotate(360deg)}}@keyframes ringRotate2{to{transform:translateY(-50%) rotateX(75deg) rotate(360deg)}}.photo{width:125px;height:125px;border-radius:50%;overflow:hidden;border:3px solid #ffb8fb;box-shadow:0 0 20px #ff6cf0,0 0 40px #a86cff;z-index:2}.photo img{width:100%;height:100%;object-fit:cover}.orbit{position:absolute;top:50%;left:50%;width:0;height:0;animation:orbitSpin linear infinite}@keyframes orbitSpin{to{transform:rotate(360deg)}}.tag{position:absolute;white-space:nowrap;background:rgba(255,150,255,.15);border:1px solid rgba(255,180,255,.35);padding:5px 12px;border-radius:999px;font-size:11px;backdrop-filter:blur(6px);box-shadow:0 0 10px rgba(255,100,255,.3)}.tag b{font-family:'Baloo 2';font-size:12px;color:#ffd6ff}#msg{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.55);text-align:center;width:90%;line-height:1.5}.spark{position:absolute;font-size:18px;animation:sparkTwinkle 2s infinite alternate}@keyframes sparkTwinkle{from{transform:scale(.8);opacity:.6}to{transform:scale(1.2);opacity:1}}</style></head><body><div id="startScreen"><div class="neon-btn" onclick="start()">START</div><div id="count">3</div><p style="margin-top:18px;color:rgba(255,255,255,.4);font-size:10px">tap START untuk Jihand ✨</p></div><div id="main"><div class="stars"></div><div class="neon-title">HAPPY BIRTHDAY JIHAND LAURA FERMEN</div><div class="center-wrap" id="cw"><div class="ring1"></div><div class="ring2"></div><div class="photo"><img src="jihand.jpg" alt="Jihand"></div><div class="orbit" style="animation-duration:16s"><div class="tag" style="transform:translate(125px,-15px)">⭐<b>You're Amazing</b></div></div><div class="orbit" style="animation-duration:19s;animation-delay:-3s"><div class="tag" style="transform:translate(-155px,-40px)">💖<b>Jihand Forever</b></div></div><div class="orbit" style="animation-duration:18s;animation-delay:-6s"><div class="tag" style="transform:translate(135px,65px)">❤️<b>Proud of You</b></div></div><div class="orbit" style="animation-duration:22s;animation-delay:-10s"><div class="tag" style="transform:translate(-140px,70px)">✨<b>Stay Happy</b></div></div><div class="orbit" style="animation-duration:17s;animation-delay:-4s"><div class="tag" style="transform:translate(0px,-120px)">💫<b>Happy Birthday Jihand</b></div></div><div class="orbit" style="animation-duration:20s;animation-delay:-8s"><div class="tag" style="transform:translate(0px,110px)">🌟<b>Jihand Cantik</b></div></div><div class="orbit" style="animation-duration:21s;animation-delay:-2s"><div class="tag" style="transform:translate(-115px,5px)">💜<b>Love You</b></div></div><div class="spark" style="left:18%;top:22%">✨</div><div class="spark" style="left:80%;top:28%">⭐</div><div class="spark" style="left:12%;top:68%">💖</div><div class="spark" style="left:88%;top:72%">🌟</div></div><div id="msg">makasih udah mencintai aku se brutal ini 🥺🤍<br>geser layar pakai jari buat muter planetnya ✨<br><br>— Nawal 💌</div><audio id="bgm" loop playsinline><source src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a650f5.mp3" type="audio/mpeg"></audio></div><script>let c=3;function start(){document.querySelector('.neon-btn').style.display='none';document.querySelector('#startScreen p').style.display='none';const countEl=document.getElementById('count');countEl.style.display='block';let iv=setInterval(()=>{c--;if(c>0){countEl.textContent=c;}else{clearInterval(iv);countEl.textContent='💖';setTimeout(showMain,500)}},700);}function showMain(){document.getElementById('startScreen').style.opacity='0';setTimeout(()=>{document.getElementById('startScreen').style.display='none';document.getElementById('main').style.display='block';document.getElementById('bgm').play().catch(()=>{});const cw=document.getElementById('cw');let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});document.addEventListener('touchmove',e=>{let dx=(e.touches[0].clientX-sx)/5;let dy=(e.touches[0].clientY-sy)/5;cw.style.transform=`translate(-50%,-50%) rotateY(${dx}deg) rotateX(${-dy}deg)`;},{passive:true});document.addEventListener('touchend',()=>{cw.style.transform='translate(-50%,-50%) rotateY(0) rotateX(0)';});},300);}</script></body></html>
