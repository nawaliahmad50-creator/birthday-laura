<head>

<title>For JIHAND LAURA FERMEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0520;font-family:sans-serif;overflow:hidden}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#ff4d8a 0%,#8a1846 45%,#1a0520 85%);opacity:0;pointer-events:none;transition:.6s;padding:20px;text-align:center}
.page.active{opacity:1;pointer-events:auto}
h1{color:#fff;font-size:36px;line-height:1.2}
.gold{color:#ffe89e;font-style:italic}
.btn{margin-top:28px;border:1.5px solid #fff;padding:14px 32px;border-radius:40px;background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px)}
#fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#ff2d78,#ff9abf)}
.heart-wrap{position:relative;width:140px;height:140px;margin:20px;background:rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 40px rgba(255,80,150,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:92%;max-width:360px;margin:18px 0}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1.5px solid rgba(255,255,255,.4)}
.wish-box{width:88%;max-width:380px;color:#fff;font-size:13px;line-height:1.7;background:rgba(0,0,0,.35);padding:18px;border-radius:16px;text-align:left;margin-top:16px}
</style>
</head>
