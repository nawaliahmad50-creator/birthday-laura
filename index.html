<script>
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active')}
let pr=0,tm;const fill=document.getElementById('fill');const pct=document.getElementById('pct');const btn=document.getElementById('heartBtn');
function up(){pr=Math.min(100,pr+2);fill.style.height=pr+'%';pct.textContent=pr+'%';if(pr>=100){clearInterval(tm);setTimeout(()=>go('2b'),500)}}
btn.addEventListener('touchstart',e=>{e.preventDefault();tm=setInterval(up,30)});btn.addEventListener('mousedown',()=>{tm=setInterval(up,30)});
window.addEventListener('touchend',()=>clearInterval(tm));window.addEventListener('mouseup',()=>clearInterval(tm));
</script>
