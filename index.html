<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday JIHAND</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#4a0a2a;overflow:hidden;font-family:sans-serif}.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#e93a7a,#6e0f36);opacity:0;pointer-events:none;transition:.5s}.page.active{opacity:1;pointer-events:auto}h1{color:white;text-align:center;font-size:28px}.gold{color:#ffde8a;font-style:italic}.btn{margin-top:20px;border:1px solid white;padding:10px 20px;border-radius:6px;background:rgba(255,255,255,.15);color:white}#fill{position:absolute;bottom:0;left:0;right:0;background:#ff7eb3}.heart-wrap{position:relative;width:120px;height:120px;margin:20px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:88%;max-width:340px}.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}</style></head><body>
<audio id="bgm" loop><source src="lagu.mp4" type="video/mp4"></audio>
<div class="page active" id="p1"><h1>A Little Surprise<br><span class="gold">Just For You</span></h1><button class="btn" onclick="document.getElementById('bgm').play();go(2)">Open Surprise 🎵</button></div>
<div class="page" id="p2"><p style="color:white">Sayang aku berapa %?</p><p id="pct" style="color:#ffde8a">0%</p><div class="heart-wrap" id="hBtn"><div id="fill" style="height:0%"></div><span style="font-size:50px;z-index:2">❤️</span></div></div>
<div class="page" id="p2b"><h1><span class="gold">100% 🥰</span></h1><button class="btn" onclick="go(3)">NEXT</button></div>
<div class="page" id="p3"><h1>Our Memories</h1><div class="grid"><img src="jihand1.jpg"><img src="jihand2.jpg"><img src="jihand3.jpg"><img src="jihand4.jpg"><img src="jihand5.jpg"><img src="jihand6.jpg"></div><button class="btn" onclick="go(4)">OPEN GIFT</button></div>
<div class="page" id="p4"><h1>Happy Birthday<br><span class="gold">JIHAND</span></h1><div style="font-size:60px" onclick="document.getElementById('w').style.display='block'">💗</div><div id="w" style="display:none;width:85%;color:white;font-size:14px;background:rgba(0,0,0,.3);padding:12px;border-radius:10px;margin-top:10px">Selamat ulang tahun JIHAND LAURA FERMEN! Lagu Shape of My Heart ini buat kamu ❤️ - Nawal</div></div>
<script>
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active')}
let pr=0,tm;const fill=document.getElementById('fill'),pct=document.getElementById('pct'),b=document.getElementById('hBtn');
function up(){pr=Math.min(100,pr+2);fill.style.height=pr+'%';pct.textContent=pr+'%';if(pr>=100){clearInterval(tm);setTimeout(()=>go('2b'),400)}}
b.addEventListener('touchstart',e=>{e.preventDefault();tm=setInterval(up,30)});b.addEventListener('mousedown',()=>tm=setInterval(up,30));
window.addEventListener('touchend',()=>clearInterval(tm));window.addEventListener('mouseup',()=>clearInterval(tm));
</script>
</body></html>
